<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเสนอราคางานก่อสร้าง — กองอาคารและสถานที่ UDRU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#ffffff;
    --bg-3:#f4f6f5;
    --line: #e7e9e4;
    --line-soft: #edefe9;
    --ink:#0f2340;
    --ink-soft:#5b6b7d;
    --ink-dim:#93a0ac;
    --safety:#e0631e;
    --safety-deep:#b84e14;
    --gold:#d9971c;
    --flame:#d1483a;
    --ok:#2f7a4f;
    --ok-bg: #eaf5ee;
    --warn:#a8710a;
    --warn-bg: #fbf1de;
    --white:#ffffff;
    --radius:16px;
    --shadow: 0 1px 2px rgba(15,35,64,.04), 0 10px 28px -16px rgba(15,35,64,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Anuphan',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Anuphan',sans-serif;letter-spacing:-.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--safety-deep);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Anuphan';font-weight:800;font-size:14px;flex:none;letter-spacing:-.02em;
    background:linear-gradient(150deg, var(--safety), var(--safety-deep));box-shadow:0 6px 16px -6px rgba(224,99,30,.55);}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .brand .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .brand .org{font-size:11px;color:var(--ink-dim);margin-top:1px;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 28px;}

  .btn{font-family:'Anuphan';font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--white);color:var(--ink);
    padding:10px 18px;border-radius:999px;cursor:pointer;transition:transform .12s, box-shadow .12s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(15,35,64,.18);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:linear-gradient(120deg, var(--safety), var(--safety-deep));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 16px -8px rgba(224,99,30,.5);}
  .btn-primary:hover{filter:brightness(1.04);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-danger{border-color:rgba(209,72,58,.35);color:var(--flame);background:rgba(209,72,58,.06);}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .eyebrow{font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--safety-deep);font-weight:600;margin-bottom:8px;display:block;}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input,textarea,select{width:100%;font-family:'Anuphan';font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg-3);color:var(--ink);}
  input::placeholder,textarea::placeholder{color:var(--ink-dim);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--safety);box-shadow:0 0 0 3px rgba(224,99,30,.12);background:#fff;}
  textarea{resize:vertical;min-height:70px;}
  .hint{font-size:12px;color:var(--ink-dim);margin-top:5px;}
  .row{display:flex;gap:12px;}
  .row>*{flex:1;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono';}
  .badge-open{background:var(--ok-bg);color:var(--ok);}
  .badge-closed{background:#f1f2ee;color:var(--ink-dim);}
  .badge-edited{background:var(--warn-bg);color:var(--warn);}
  .badge-lowest{background:var(--ok-bg);color:var(--ok);}

  .cat-chip{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;margin:0 6px 6px 0;cursor:pointer;background:var(--bg-3);color:var(--ink-soft);transition:border-color .12s, color .12s, background .12s;}
  .cat-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .tabbar{display:flex;gap:6px;background:var(--bg-3);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px;}
  .tabbtn{flex:1;text-align:center;padding:11px 10px;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s;}
  .tabbtn.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(15,35,64,.2);}
  .tabbtn .cnt{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-dim);margin-left:4px;}

  .job-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line-soft);}
  .job-row:first-child{border-top:none;}
  .job-title{font-weight:700;font-size:15.5px;color:var(--ink);}
  .job-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .job-actions{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;}

  .spec-group-title{font-weight:700;font-size:13.5px;color:var(--safety-deep);margin:16px 0 6px;font-family:'JetBrains Mono';letter-spacing:.3px;}
  .spec-group-title:first-child{margin-top:0;}
  .spec-item-line{font-size:14px;color:var(--ink);padding:6px 0;border-top:1px solid var(--line-soft);}
  .spec-item-line:first-child{border-top:none;}
  .spec-item-name{font-weight:600;}
  .spec-item-detail{color:var(--ink-soft);font-size:12.5px;}

  .spec-row{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg-3);}
  .spec-row .fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .spec-row .fields .full{grid-column:1/-1;}
  .spec-row input{background:#fff;}
  .spec-row .rm{flex:none;}

  .item-bid-input-group{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg-3);}
  .item-bid-input-group .item-title{font-weight:700;font-size:14.5px;margin-bottom:2px;}
  .item-bid-input-group .item-detail{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}

  .bid-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .bid-card-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .bid-item-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line-soft);font-size:13.5px;}
  .bid-item-row:first-child{border-top:none;}
  .bid-item-row .lp{font-weight:600;}
  .bid-item-row .rp{font-family:'JetBrains Mono';font-weight:700;color:var(--safety-deep);}
  .bid-item-row.lowest .rp{color:var(--ok);}

  .quote-item{border-top:1px solid var(--line-soft);padding:13px 0;}
  .quote-item:first-child{border-top:none;}
  .quote-note{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .quote-file{font-size:13px;margin-top:6px;}

  .prod-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .prod-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .prod-price{font-family:'JetBrains Mono';font-weight:700;color:var(--safety-deep);font-size:16px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-dim);}
  .empty .disp{font-size:16px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}

  .gate{max-width:380px;margin:12vh auto;text-align:center;}
  .gate .mark{width:52px;height:52px;margin:0 auto 18px;font-size:16px;border-radius:16px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:50;box-shadow:0 12px 30px -8px rgba(15,35,64,.35);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;}
  .toast.show{opacity:1;bottom:32px;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,35,64,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .modal{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(15,35,64,.3);}

  .link-box{display:flex;gap:8px;background:var(--bg-3);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;align-items:center;margin-top:9px;}
  .link-box input{border:none;background:transparent;font-family:'JetBrains Mono';font-size:12.5px;padding:2px;color:var(--ink-soft);}

  .status-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  footer{text-align:center;font-size:12px;color:var(--ink-dim);padding:30px 0 40px;}
  @media(max-width:640px){
    .wrap{padding:20px 16px;}
    .job-row{flex-direction:column;align-items:flex-start;}
    .job-actions{justify-content:flex-start;}
    .row{flex-direction:column;}
    .spec-row .fields{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">MET</div>
    <div>
      <h1>ระบบเสนอราคางานก่อสร้าง</h1>
      <div class="sub" id="topbarSub">กองอาคารและสถานที่</div>
      <div class="org">มหาวิทยาลัยราชภัฏอุดรธานี</div>
    </div>
  </div>
  <div id="topbarActions"></div>
</div>

<div class="wrap" id="app"><div class="empty">กำลังโหลด…</div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================================================================
   ตั้งค่า Firebase (คัดลอกจาก Firebase Console > Project settings)
   =================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBFhFb7_vYwujPV4VYpewVo8PlcM_X1yKc",
  authDomain: "met-udru.firebaseapp.com",
  projectId: "met-udru",
  storageBucket: "met-udru.firebasestorage.app",
  messagingSenderId: "480414511578",
  appId: "1:480414511578:web:57e01aca33d6768dc850e3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ===================================================================
   ตั้งค่า Cloudinary (สำหรับเก็บไฟล์แนบ)
   =================================================================== */
const CLOUDINARY_CLOUD_NAME = "giingj2r";
const CLOUDINARY_UPLOAD_PRESET = "met_udru";

async function uploadToCloudinary(file, folder){
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
  const form = new FormData();
  form.append('file', file);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  form.append('folder', folder);
  const res = await fetch(url, { method:'POST', body: form });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('อัปโหลดไฟล์ไม่สำเร็จ: ' + errText);
  }
  const data = await res.json();
  return { url: data.secure_url, name: file.name };
}

const DEFAULT_CATEGORIES = [
  "งานครุภัณฑ์","งานตกแต่ง","งานฝ้าเพดาน","งานพื้น","งานภูมิทัศน์","งานหลังคา"
];

/* โหมดทดสอบ: ข้ามหน้าล็อกอินแอดมิน ต้องปิดก่อนใช้งานจริง (พร้อมตั้ง Firestore Rules ให้รัดกุม) */
const TEST_MODE_NO_LOGIN = true;

const app = document.getElementById('app');
const topbarActions = document.getElementById('topbarActions');
const topbarSub = document.getElementById('topbarSub');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtBaht(n){ const num = Number(n)||0; return num.toLocaleString('th-TH',{maximumFractionDigits:2}) + ' บาท'; }
function fmtDate(ts){ if(!ts) return '-'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function normPhone(p){ return (p||'').replace(/[^0-9]/g,''); }

/* =========================================================
   ROUTER
   - ?vendor=1  -> ลิงก์เดียวสำหรับทุกบริษัท (ประมูลราคา + ข้อมูลสินค้า)
   - ไม่มีพารามิเตอร์ -> หลังบ้านแอดมิน (ต้องล็อกอิน)
========================================================= */
const params = new URLSearchParams(location.search);
const isVendor = params.has('vendor');

if(isVendor){
  topbarSub.textContent = 'พอร์ทัลสำหรับบริษัท';
  topbarActions.innerHTML = '';
  renderVendorPortal();
} else {
  topbarSub.textContent = 'หลังบ้านผู้ดูแล' + (TEST_MODE_NO_LOGIN ? ' (โหมดทดสอบ ไม่ได้ล็อกอิน)' : '');
  if(TEST_MODE_NO_LOGIN){
    renderAdmin({email:'โหมดทดสอบ — ยังไม่ได้ล็อกอิน'});
  } else {
    auth.onAuthStateChanged(user=>{ if(user){ renderAdmin(user); } else { renderLogin(); } });
  }
}

/* =========================================================
   ADMIN: LOGIN
========================================================= */
function renderLogin(){
  topbarActions.innerHTML = '';
  app.innerHTML = `
    <div class="gate card">
      <div class="mark disp" style="width:52px;height:52px;font-size:17px;margin:0 auto 18px;">MET</div>
      <h2 class="disp" style="margin:0 0 4px;">เข้าสู่ระบบผู้ดูแล</h2>
      <p class="hint" style="margin-bottom:18px;">สำหรับเจ้าหน้าที่มหาวิทยาลัยเท่านั้น</p>
      <label>อีเมล</label><input id="loginEmail" type="email" placeholder="admin@example.com">
      <label>รหัสผ่าน</label><input id="loginPass" type="password" placeholder="••••••••">
      <button class="btn btn-primary" style="width:100%;margin-top:18px;" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="hint" id="loginErr" style="color:var(--flame);margin-top:10px;"></div>
      <p class="hint" style="margin-top:16px;">สร้างบัญชีผู้ดูแลได้ที่ Firebase Console &gt; Authentication &gt; Sign-in method &gt; Email/Password</p>
    </div>`;
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr'); err.textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(e=>{ err.textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + (e.message||e.code); });
}

/* =========================================================
   ADMIN: STATE + DASHBOARD SHELL
========================================================= */
let ADMIN_STATE = { tab:'bid', categories:[], jobs:[], products:[], activeCat:'all', productFilter:'' };

function renderAdmin(user){
  topbarActions.innerHTML = TEST_MODE_NO_LOGIN ? `
    <span class="hint" style="margin:0;color:var(--warn);font-weight:600;">⚠ โหมดทดสอบ ไม่มีการล็อกอิน</span>
  ` : `
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="hint" style="margin:0;">${escapeHtml(user.email)}</span>
      <button class="btn btn-ghost btn-sm" onclick="auth.signOut()">ออกจากระบบ</button>
    </div>`;
  loadAdminData();
}

async function loadAdminData(){
  app.innerHTML = `<div class="empty">กำลังโหลดข้อมูล…</div>`;
  const catSnap = await db.collection('categories').orderBy('order').get().catch(()=>null);
  if(!catSnap || catSnap.empty){ await seedCategories(); return loadAdminData(); }
  ADMIN_STATE.categories = catSnap.docs.map(d=>({id:d.id, ...d.data()}));

  const jobSnap = await db.collection('jobs').orderBy('createdAt','desc').get();
  ADMIN_STATE.jobs = jobSnap.docs.map(d=>({id:d.id, items:[], ...d.data()}));

  const prodSnap = await db.collection('products').orderBy('submittedAt','desc').get().catch(()=>null);
  ADMIN_STATE.products = prodSnap ? prodSnap.docs.map(d=>({id:d.id, ...d.data()})) : [];

  drawAdminShell();
}

async function seedCategories(){
  const batch = db.batch();
  DEFAULT_CATEGORIES.forEach((name, i)=>{ const ref = db.collection('categories').doc(); batch.set(ref, {name, order:i}); });
  await batch.commit();
}

function drawAdminShell(){
  const vendorLink = location.origin + location.pathname + '?vendor=1';
  app.innerHTML = `
    <div class="card">
      <span class="eyebrow">ลิงก์เดียวสำหรับทุกบริษัท</span>
      <p class="hint" style="margin-top:0;">ส่งลิงก์นี้ให้บริษัททุกแห่ง ใช้ลิงก์เดียวกันทั้งหมด ฝั่งบริษัทจะแก้ไขหน้าเว็บเองไม่ได้ ทำได้แค่กรอกและส่งข้อมูลของตนเอง</p>
      <div class="link-box"><input readonly value="${vendorLink}" onclick="this.select()">
        <button class="btn btn-ghost btn-sm" onclick="copyLink('${vendorLink}')">คัดลอกลิงก์</button></div>
    </div>
    <div class="tabbar">
      <div class="tabbtn ${ADMIN_STATE.tab==='bid'?'active':''}" onclick="setAdminTab('bid')">ประมูลราคาโครงการ <span class="cnt">${ADMIN_STATE.jobs.length}</span></div>
      <div class="tabbtn ${ADMIN_STATE.tab==='data'?'active':''}" onclick="setAdminTab('data')">คลังข้อมูลสินค้า <span class="cnt">${ADMIN_STATE.products.length}</span></div>
    </div>
    <div id="adminTabContent"></div>
  `;
  drawAdminTabContent();
}
function setAdminTab(t){ ADMIN_STATE.tab = t; drawAdminShell(); }
function copyLink(url){ navigator.clipboard.writeText(url).then(()=>toast('คัดลอกลิงก์แล้ว')); }

function drawAdminTabContent(){
  const el = document.getElementById('adminTabContent');
  if(ADMIN_STATE.tab==='bid') el.innerHTML = adminBidTabHtml(); else el.innerHTML = adminDataTabHtml();
}

/* ---------- ADMIN: BIDDING TAB ---------- */
function adminBidTabHtml(){
  const cats = ADMIN_STATE.categories;
  const activeCat = ADMIN_STATE.activeCat;
  const jobs = ADMIN_STATE.jobs.filter(j => activeCat==='all' || j.categoryId===activeCat);
  return `
    <div class="card">
      <span class="eyebrow">หมวดงาน</span>
      <div>
        <span class="cat-chip ${activeCat==='all'?'active':''}" onclick="setCat('all')">ทั้งหมด (${ADMIN_STATE.jobs.length})</span>
        ${cats.map(c=>{
          const count = ADMIN_STATE.jobs.filter(j=>j.categoryId===c.id).length;
          return `<span class="cat-chip ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')">${escapeHtml(c.name)} (${count})</span>`;
        }).join('')}
        <span class="cat-chip" style="border-style:dashed;" onclick="promptNewCategory()">+ เพิ่มหมวดงาน</span>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="eyebrow" style="margin:0;">รายการโครงการ</span>
        <button class="btn btn-primary btn-sm" onclick="openJobModal()">+ สร้างโครงการใหม่</button>
      </div>
      <div id="jobList">

function setCat(id){ ADMIN_STATE.activeCat = id; drawAdminTabContent(); }
function catName(id){ const c = ADMIN_STATE.categories.find(c=>c.id===id); return c ? c.name : '-'; }

function renderJobRow(j){
  const isOpen = j.status !== 'closed';
  const items = j.items || [];
  return `
    <div class="job-row">
      <div>
        <div class="job-title">${escapeHtml(j.title)} <span class="badge ${isOpen?'badge-open':'badge-closed'}">${isOpen?'เปิดรับ':'ปิดรับแล้ว'}</span></div>
        <div class="job-meta">${escapeHtml(catName(j.categoryId))}${j.deadline? ' · กำหนดส่งภายใน ' + escapeHtml(j.deadline):''} · ${items.length} รายการสเปค · สร้างเมื่อ ${fmtDate(j.createdAt)}</div>
      </div>
      <div class="job-actions">
        <button class="btn btn-sm" onclick="toggleQuotes('${j.id}')">ดูราคาที่เสนอ</button>
        <button class="btn btn-ghost btn-sm" onclick="openJobModal('${j.id}')">แก้ไข</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleJobStatus('${j.id}','${isOpen?'closed':'open'}')">${isOpen?'ปิดรับงาน':'เปิดรับอีกครั้ง'}</button>

      </div>
    </div>
    <div id="quotes-${j.id}"></div>`;

async function toggleJobStatus(jobId, newStatus){
  await db.collection('jobs').doc(jobId).update({status:newStatus});
  const j = ADMIN_STATE.jobs.find(j=>j.id===jobId); if(j) j.status = newStatus;
  drawAdminTabContent();
}
async function deleteJob(jobId){
  if(!confirm('ยืนยันลบโครงการนี้? ใบเสนอราคาทั้งหมดของโครงการนี้จะถูกลบด้วย')) return;
  const qs = await db.collection('quotes').where('jobId','==',jobId).get();
  const batch = db.batch();
  qs.docs.forEach(d=>batch.delete(d.ref));
  batch.delete(db.collection('jobs').doc(jobId));
  await batch.commit();
  ADMIN_STATE.jobs = ADMIN_STATE.jobs.filter(j=>j.id!==jobId);
  drawAdminTabContent();
  toast('ลบโครงการแล้ว');
}

let openQuotePanels = new Set();
async function toggleQuotes(jobId){
  const el = document.getElementById('quotes-'+jobId);
  if(openQuotePanels.has(jobId)){ openQuotePanels.delete(jobId); el.innerHTML=''; return; }
  openQuotePanels.add(jobId);
  el.innerHTML = `<div class="empty" style="padding:16px;">กำลังโหลดใบเสนอราคา…</div>`;
  const job = ADMIN_STATE.jobs.find(j=>j.id===jobId);
  const items = job.items || [];
  const snap = await db.collection('quotes').where('jobId','==',jobId).get();
  const bidsDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(bidsDocs.length===0){
    el.innerHTML = `<div class="empty" style="padding:16px;">ยังไม่มีบริษัทเสนอราคาเข้ามา</div>`;
    return;
  }
  const minPerItem = {};
  items.forEach(it=>{
    let min = Infinity;
    bidsDocs.forEach(b=>{ const bid = (b.bids||{})[it.id]; if(bid && typeof bid.price==='number' && bid.price < min) min = bid.price; });
    minPerItem[it.id] = min;
  });
  bidsDocs.sort((a,b)=>(a.companyName||'').localeCompare(b.companyName||'','th'));
  el.innerHTML = `<div class="card" style="margin-top:8px;">
    <span class="eyebrow">ใบเสนอราคาทั้งหมด (${bidsDocs.length} บริษัท) — ไฮไลต์เขียว = ราคาต่ำสุดของรายการนั้น</span>
    ${bidsDocs.map(b=>{
      const rows = items.filter(it=>(b.bids||{})[it.id]).map(it=>{
        const bid = b.bids[it.id];
        const isLowest = bid.price === minPerItem[it.id];
        return `<div class="bid-item-row ${isLowest?'lowest':''}">
          <span class="lp">${escapeHtml(it.group)} — ${escapeHtml(it.name)}${bid.product?' · เสนอ: '+escapeHtml(bid.product):''}</span>
          <span class="rp">${fmtBaht(bid.price)}${isLowest?' <span class=\"badge badge-lowest\">ต่ำสุด</span>':''}</span>
        </div>`;
      }).join('') || '<div class="hint">ไม่มีรายการที่เสนอราคา</div>';
      return `<div class="bid-card">
        <div class="bid-card-top">
          <span class="quote-company" style="font-weight:700;">${escapeHtml(b.companyName)}</span>
          ${b.isEdited?'<span class="badge badge-edited">แก้ไขแล้ว</span>':''}
          <span class="hint" style="margin:0;">โทร ${escapeHtml(b.companyPhone)} · ส่งล่าสุด ${fmtDate(b.updatedAt||b.submittedAt)}</span>
        </div>
        ${rows}
        ${b.note?`<div class="quote-note">รายละเอียดเพิ่มเติม: ${escapeHtml(b.note)}</div>`:''}
        ${b.fileURL?`<div class="quote-file">📎 <a href="${b.fileURL}" target="_blank" rel="noopener">${escapeHtml(b.fileName||'เอกสารแนบ')}</a></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function promptNewCategory(){

/* ---- Job create/edit modal with dynamic spec items ---- */
let SPEC_DRAFT = [];
function openJobModal(jobId){
  const editing = !!jobId;
  const job = editing ? ADMIN_STATE.jobs.find(j=>j.id===jobId) : null;
  SPEC_DRAFT = editing ? JSON.parse(JSON.stringify(job.items||[])) : [];
  const catOptions = ADMIN_STATE.categories.map(c=>`<option value="${c.id}" ${job&&job.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3 class="disp" style="margin-top:0;">${editing?'แก้ไขโครงการ':'สร้างโครงการใหม่'}</h3>
      <label>หมวดงาน</label><select id="newJobCat">${catOptions}</select>
      <label>ชื่อโครงการ</label><input id="newJobTitle" placeholder="เช่น ปรับปรุงอาคารเรียนรวม 1" value="${editing?escapeHtml(job.title):''}">
      <label>รายละเอียด (ไม่บังคับ)</label><textarea id="newJobDesc" placeholder="ขอบเขตงาน เงื่อนไข ฯลฯ">${editing?escapeHtml(job.description||''):''}</textarea>
      <label>กำหนดส่งราคาภายใน (ไม่บังคับ)</label><input id="newJobDeadline" placeholder="เช่น 30 ก.ย. 2569" value="${editing?escapeHtml(job.deadline||''):''}">
      <label style="margin-bottom:2px;">รายการสเปคของโครงการ</label>
      <div class="hint" style="margin-top:0;margin-bottom:8px;">แยกตามกลุ่มงาน เช่น กลุ่ม “พื้น” รายการ “กระเบื้อง 60×60” — บริษัทจะเสนอผลิตภัณฑ์และราคาแยกตามแต่ละรายการ</div>
      <div id="specRows"></div>
      <button class="btn btn-ghost btn-sm" type="button" onclick="addSpecRow()">+ เพิ่มรายการสเปค</button>

        <button class="btn btn-ghost" style="flex:1;" onclick="this.closest('.modal-bg').remove()">ยกเลิก</button>

      </div>
    </div>`;
  document.body.appendChild(bg);
  drawSpecRows();
}
function addSpecRow(){ SPEC_DRAFT.push({id: uid(), group:'', name:'', spec:'', unit:'', qty:''}); drawSpecRows(); }
function removeSpecRow(id){ SPEC_DRAFT = SPEC_DRAFT.filter(s=>s.id!==id); drawSpecRows(); }
function updateSpecField(id, field, val){ const s = SPEC_DRAFT.find(s=>s.id===id); if(s) s[field]=val; }
function drawSpecRows(){
  const el = document.getElementById('specRows');
  if(!el) return;
  el.innerHTML = SPEC_DRAFT.length===0 ? '<div class="hint" style="margin-bottom:10px;">ยังไม่มีรายการสเปค กด “เพิ่มรายการสเปค” เพื่อเริ่ม</div>' :
    SPEC_DRAFT.map(s=>`
      <div class="spec-row">
        <div class="fields">
          <input placeholder="กลุ่มงาน เช่น พื้น" value="${escapeHtml(s.group)}" oninput="updateSpecField('${s.id}','group',this.value)">
          <input placeholder="รายการ เช่น กระเบื้อง 60×60" value="${escapeHtml(s.name)}" oninput="updateSpecField('${s.id}','name',this.value)">
          <input class="full" placeholder="สเปค/รายละเอียด เช่น เกรด A สีเทา กันลื่น" value="${escapeHtml(s.spec)}" oninput="updateSpecField('${s.id}','spec',this.value)">
          <input placeholder="หน่วย เช่น ตร.ม." value="${escapeHtml(s.unit)}" oninput="updateSpecField('${s.id}','unit',this.value)">
          <input placeholder="จำนวน" value="${escapeHtml(s.qty)}" oninput="updateSpecField('${s.id}','qty',this.value)">
        </div>
        <button class="btn btn-danger btn-sm rm" type="button" onclick="removeSpecRow('${s.id}')">ลบ</button>
      </div>`).join('');
}
async function saveJob(jobId){
  const categoryId = document.getElementById('newJobCat').value;
  const title = document.getElementById('newJobTitle').value.trim();
  const description = document.getElementById('newJobDesc').value.trim();
  const deadline = document.getElementById('newJobDeadline').value.trim();
  if(!title){ toast('กรุณากรอกชื่อโครงการ'); return; }
  const items = SPEC_DRAFT.filter(s=>s.name.trim()).map(s=>({...s, group: s.group.trim()||'ทั่วไป', name: s.name.trim()}));
  if(jobId){
    await db.collection('jobs').doc(jobId).update({categoryId, title, description, deadline, items});
    toast('บันทึกการแก้ไขแล้ว');
  } else {
    await db.collection('jobs').add({categoryId, title, description, deadline, items, status:'open', createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    toast('สร้างโครงการแล้ว');
  }
  document.querySelector('.modal-bg')?.remove();
  loadAdminData();
}

      <label>รายละเอียดเพิ่มเติมของใบเสนอราคา (ไม่บังคับ)</label>
      <textarea id="bidNote" placeholder="เงื่อนไข ระยะเวลาส่งมอบ ฯลฯ">${existing?escapeHtml(existing.note||''):''}</textarea>
      <label>แนบไฟล์ใบเสนอราคา (ไม่บังคับ)</label>
      <input id="bidFile" type="file" accept=".pdf,image/*">
      ${existing&&existing.fileURL?`<div class="quote-file">ไฟล์เดิม: 📎 <a href="${existing.fileURL}" target="_blank" rel="noopener">${escapeHtml(existing.fileName||'เอกสารแนบ')}</a> (แนบไฟล์ใหม่เพื่อแทนที่)</div>`:''}
      <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="submitBidBtn" onclick="submitBid('${VENDOR_STATE.activeJobId}')">${existing?'ส่งราคาอีกครั้ง (แก้ไข)':'ส่งใบเสนอราคา'}</button>
      <div class="hint" id="submitBidMsg" style="margin-top:10px;"></div>
    </div>`;
}

async function submitBid(jobId){
  const phone = requirePhone(); if(!phone) return;
  const job = VENDOR_STATE.activeJob;
  const items = job.items || [];
  const btn = document.getElementById('submitBidBtn');
  const msg = document.getElementById('submitBidMsg');
  btn.disabled = true; btn.textContent = 'กำลังส่ง…'; msg.textContent=''; 

  const bids = {};
  items.forEach(it=>{
    const prodEl = document.getElementById('bidprod_'+it.id);
    const priceEl = document.getElementById('bidprice_'+it.id);
    const priceVal = priceEl ? parseFloat(priceEl.value) : NaN;
    const prodVal = prodEl ? prodEl.value.trim() : '';
    if(!isNaN(priceVal) || prodVal){ bids[it.id] = { product: prodVal, price: isNaN(priceVal)?null:priceVal }; }
  });
  if(Object.keys(bids).length===0){
    msg.style.color='var(--flame)'; msg.textContent='กรุณาเสนอราคาอย่างน้อย 1 รายการ';
    btn.disabled=false; btn.textContent = VENDOR_STATE.existingBid?'ส่งราคาอีกครั้ง (แก้ไข)':'ส่งใบเสนอราคา';
    return;
  }
  const note = document.getElementById('bidNote').value.trim();
  const fileInput = document.getElementById('bidFile');

  const quoteId = jobId+'_'+phone;
  const quoteRef = db.collection('quotes').doc(quoteId);
  try{
    const existing = await quoteRef.get();
    const isEdit = existing.exists;
    let fileURL = existing.exists ? existing.data().fileURL||null : null;
    let fileName = existing.exists ? existing.data().fileName||null : null;
    const file = fileInput.files[0];
    if(file){
      btn.textContent = 'กำลังอัปโหลดไฟล์แนบ…';
      const uploaded = await uploadToCloudinary(file, `quotes/${jobId}`);
      fileURL = uploaded.url; fileName = uploaded.name;
      btn.textContent = 'กำลังส่ง…';
    }
    const payload = {
      jobId, companyName: VENDOR_STATE.companyName.trim(), companyPhone: VENDOR_STATE.companyPhone.trim(),
      note, fileURL, fileName, bids,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: isEdit
    };
    if(isEdit){ payload.firstSubmittedAt = existing.data().firstSubmittedAt || existing.data().submittedAt || firebase.firestore.FieldValue.serverTimestamp(); }
    else { payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp(); payload.firstSubmittedAt = firebase.firestore.FieldValue.serverTimestamp(); }
    await quoteRef.set(payload, {merge:true});

    await db.collection('publicEntries').doc(quoteId).set({
      jobId, companyName: VENDOR_STATE.companyName.trim(),
      submittedAt: payload.firstSubmittedAt || firebase.firestore.FieldValue.serverTimestamp(), isEdited: isEdit
    }, {merge:true});

    msg.style.color='var(--ok)';
    msg.textContent = isEdit ? '✓ แก้ไขใบเสนอราคาเรียบร้อยแล้ว' : '✓ ส่งใบเสนอราคาเรียบร้อยแล้ว ขอบคุณครับ';
    toast('บันทึกใบเสนอราคาแล้ว');
    VENDOR_STATE.existingBid = payload;
  }catch(e){
    msg.style.color='var(--flame)'; msg.textContent = 'เกิดข้อผิดพลาด: ' + (e.message||e);
  }finally{
    btn.disabled=false; btn.textContent = VENDOR_STATE.existingBid?'ส่งราคาอีกครั้ง (แก้ไข)':'ส่งใบเสนอราคา';
  }
}

/* ---- Data tab: free product submission ---- */

  return `
    <div class="card">
      <span class="eyebrow">เสนอข้อมูลสินค้า/ผลิตภัณฑ์ (ไม่ผูกกับโครงการใด)</span>
      <p class="hint" style="margin-top:0;">ใช้สำหรับนำเสนอสินค้าทั่วไปของบริษัทท่าน ไม่จำเป็นต้องเกี่ยวข้องกับโครงการที่เปิดประมูลอยู่</p>
      <label>ชื่อสินค้า/ผลิตภัณฑ์ *</label><input id="pName" placeholder="เช่น กระเบื้องยาง SPC รุ่น...">
      <label>หมวดหมู่ (ไม่บังคับ)</label><input id="pCategory" placeholder="เช่น วัสดุปูพื้น">
      <label>ราคา (บาท, ไม่บังคับ)</label><input id="pPrice" type="number" min="0" step="0.01" placeholder="0.00">
      <label>รายละเอียด (ไม่บังคับ)</label><textarea id="pDesc" placeholder="สเปค คุณสมบัติ เงื่อนไข ฯลฯ"></textarea>
      <label>แนบไฟล์/รูปสินค้า (ไม่บังคับ)</label><input id="pFile" type="file" accept=".pdf,image/*">
      <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="submitProdBtn" onclick="submitProduct()">บันทึกข้อมูลสินค้า</button>
      <div class="hint" id="submitProdMsg" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="eyebrow" style="margin:0;">สินค้าที่เคยส่งด้วยเบอร์นี้</span>
        <button class="btn btn-ghost btn-sm" onclick="loadMyProducts()">ค้นหา</button>
      </div>
      <div id="myProductsList" class="hint" style="margin-top:10px;">กรอกเบอร์ติดต่อด้านบน แล้วกด “ค้นหา” เพื่อดูและแก้ไขรายการที่เคยส่ง</div>
    </div>`;
}

async function loadMyProducts(){
  const phone = requirePhone(); if(!phone) return;
  const el = document.getElementById('myProductsList');
  el.innerHTML = 'กำลังค้นหา…';
  const snap = await db.collection('products').where('companyPhone','==', VENDOR_STATE.companyPhone.trim()).get().catch(()=>null);
  VENDOR_STATE.myProducts = snap ? snap.docs.map(d=>({id:d.id, ...d.data()})) : [];
  if(VENDOR_STATE.myProducts.length===0){ el.innerHTML = 'ยังไม่พบสินค้าที่เคยส่งด้วยเบอร์นี้'; return; }
  el.innerHTML = VENDOR_STATE.myProducts.map(p=>`
    <div class="prod-card">
      <div class="prod-top"><span class="quote-company" style="font-weight:700;">${escapeHtml(p.productName)}</span><span class="prod-price">${p.price!=null?fmtBaht(p.price):'-'}</span></div>
      <div class="quote-note">${escapeHtml(p.category||'')}</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="editMyProduct('${p.id}')">แก้ไขรายการนี้</button>
    </div>`).join('');
}
function editMyProduct(id){
  const p = VENDOR_STATE.myProducts.find(p=>p.id===id); if(!p) return;
  VENDOR_STATE.editingProductId = id;
  document.getElementById('pName').value = p.productName||'';
  document.getElementById('pCategory').value = p.category||'';
  document.getElementById('pPrice').value = p.price!=null?p.price:'';
  document.getElementById('pDesc').value = p.description||'';
  document.getElementById('submitProdBtn').textContent = 'บันทึกการแก้ไข';
  window.scrollTo({top:0, behavior:'smooth'});
  toast('โหลดข้อมูลมาแก้ไขแล้ว');
}

async function submitProduct(){
  const phone = requirePhone(); if(!phone) return;
  const productName = document.getElementById('pName').value.trim();
  const category = document.getElementById('pCategory').value.trim();
  const priceVal = parseFloat(document.getElementById('pPrice').value);
  const description = document.getElementById('pDesc').value.trim();
  const fileInput = document.getElementById('pFile');
  const btn = document.getElementById('submitProdBtn');
  const msg = document.getElementById('submitProdMsg');
  if(!productName){ msg.style.color='var(--flame)'; msg.textContent='กรุณากรอกชื่อสินค้า'; return; }
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; msg.textContent='';
  try{
    const isEdit = !!VENDOR_STATE.editingProductId;
    const id = VENDOR_STATE.editingProductId || uid();
    const ref = db.collection('products').doc(id);
    let fileURL = null, fileName = null;
    if(isEdit){ const cur = await ref.get(); if(cur.exists){ fileURL = cur.data().fileURL||null; fileName = cur.data().fileName||null; } }
    const file = fileInput.files[0];
    if(file){
      btn.textContent = 'กำลังอัปโหลดไฟล์แนบ…';
      const uploaded = await uploadToCloudinary(file, `products/${id}`);
      fileURL = uploaded.url; fileName = uploaded.name;
      btn.textContent = 'กำลังบันทึก…';
    }
    const payload = {
      companyName: VENDOR_STATE.companyName.trim(), companyPhone: VENDOR_STATE.companyPhone.trim(),
      productName, category, price: isNaN(priceVal)?null:priceVal, description, fileURL, fileName,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: isEdit
    };
    if(!isEdit) payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp();
    await ref.set(payload, {merge:true});
    msg.style.color='var(--ok)'; msg.textContent = isEdit ? '✓ แก้ไขข้อมูลสินค้าเรียบร้อยแล้ว' : '✓ บันทึกข้อมูลสินค้าเรียบร้อยแล้ว ขอบคุณครับ';
    toast('บันทึกสินค้าแล้ว');
    VENDOR_STATE.editingProductId = null;
    btn.textContent = 'บันทึกข้อมูลสินค้า';
    loadMyProducts();
  }catch(e){
    msg.style.color='var(--flame)'; msg.textContent = 'เกิดข้อผิดพลาด: ' + (e.message||e);
  }finally{
    btn.disabled = false;
  }
}
</script>
