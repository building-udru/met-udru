<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเสนอราคางานก่อสร้าง — กองอาคารและสถานที่ UDRU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#ffffff;
    --bg-3:#f4f6f5;
    --line: #e7e9e4;
    --line-soft: #edefe9;
    --ink:#0f2340;
    --ink-soft:#5b6b7d;
    --ink-dim:#93a0ac;
    --safety:#e0631e;
    --safety-deep:#b84e14;
    --gold:#d9971c;
    --flame:#d1483a;
    --ok:#2f7a4f;
    --ok-bg: #eaf5ee;
    --warn:#a8710a;
    --warn-bg: #fbf1de;
    --white:#ffffff;
    --radius:16px;
    --shadow: 0 1px 2px rgba(15,35,64,.04), 0 10px 28px -16px rgba(15,35,64,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Anuphan',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Anuphan',sans-serif;letter-spacing:-.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--safety-deep);transition:opacity .12s ease;}
  a:hover{opacity:.75;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Anuphan';font-weight:800;font-size:17px;flex:none;letter-spacing:-.02em;
    background:linear-gradient(150deg, var(--safety), var(--safety-deep));box-shadow:0 6px 16px -6px rgba(224,99,30,.55);}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .brand .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .brand .org{font-size:11px;color:var(--ink-dim);margin-top:1px;}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 28px;}

  .btn{font-family:'Anuphan';font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--white);color:var(--ink);
    padding:10px 18px;border-radius:999px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease, color .12s ease;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(15,35,64,.18);border-color:var(--ink-dim);}
  .btn:active{transform:translateY(0) scale(.98);box-shadow:0 2px 6px -4px rgba(15,35,64,.2);}
  .btn-primary{background:linear-gradient(120deg, var(--safety), var(--safety-deep));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 16px -8px rgba(224,99,30,.5);}
  .btn-primary:hover{filter:brightness(1.07);border-color:transparent;box-shadow:0 10px 22px -8px rgba(224,99,30,.6);}
  .btn-primary:active{filter:brightness(.98);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--bg-3);color:var(--ink);}
  .btn-danger{border-color:rgba(209,72,58,.35);color:var(--flame);background:rgba(209,72,58,.06);}
  .btn-danger:hover{background:rgba(209,72,58,.12);border-color:rgba(209,72,58,.5);}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:disabled:hover{transform:none;box-shadow:none;border-color:var(--line);background:var(--white);}
  .btn-item-submit{width:100%;justify-content:center;display:flex;align-items:center;gap:6px;margin-top:12px;}

  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow .15s ease, border-color .15s ease;}
  .eyebrow{font-family:'JetBrains Mono';font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--safety-deep);font-weight:600;margin-bottom:8px;display:block;}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input,textarea,select{width:100%;font-family:'Anuphan';font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg-3);color:var(--ink);transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;}
  input::placeholder,textarea::placeholder{color:var(--ink-dim);}
  input:hover,textarea:hover,select:hover{border-color:var(--ink-dim);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--safety);box-shadow:0 0 0 3px rgba(224,99,30,.12);background:#fff;}
  select{cursor:pointer;}
  textarea{resize:vertical;min-height:70px;}
  .hint{font-size:12px;color:var(--ink-dim);margin-top:5px;}
  .row{display:flex;gap:12px;}
  .row>*{flex:1;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono';}
  .badge-open{background:var(--ok-bg);color:var(--ok);}
  .badge-closed{background:#f1f2ee;color:var(--ink-dim);}
  .badge-edited{background:var(--warn-bg);color:var(--warn);}
  .badge-lowest{background:var(--ok-bg);color:var(--ok);}
  .badge-cat{background:#eef1fb;color:#3a4b8a;}

  .cat-chip{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;margin:0 6px 6px 0;cursor:pointer;background:var(--bg-3);color:var(--ink-soft);transition:border-color .12s ease, color .12s ease, background .12s ease, transform .12s ease;}
  .cat-chip:hover{border-color:var(--safety);color:var(--safety-deep);transform:translateY(-1px);}
  .cat-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .cat-chip.active:hover{border-color:var(--ink);color:#fff;filter:brightness(1.15);}

  .tabbar{display:flex;flex-direction:row;gap:6px;background:var(--bg-3);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px;}
  .tabbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;padding:11px 10px;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink-soft);transition:background .15s ease,color .15s ease,transform .1s ease;white-space:nowrap;}
  .tabbtn .ico{font-size:16px;line-height:1;flex:none;}
  .tabbtn:hover{background:rgba(255,255,255,.6);color:var(--ink);}
  .tabbtn.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(15,35,64,.2);}
  .tabbtn.active:hover{background:#fff;}
  .tabbtn:active{transform:scale(.98);}
  .tabbtn .cnt{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-dim);margin-left:2px;}
  @media(max-width:480px){
    .tabbtn{font-size:13px;padding:10px 6px;gap:5px;}
  }

  .job-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line-soft);border-radius:10px;transition:background .12s ease;}
  .job-row:hover{background:var(--bg-3);}
  .job-row:first-child{border-top:none;}
  .job-title{font-weight:700;font-size:15.5px;color:var(--ink);}
  .job-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .job-actions{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;}

  .spec-group-title{font-weight:700;font-size:13.5px;color:var(--safety-deep);margin:16px 0 6px;font-family:'JetBrains Mono';letter-spacing:.3px;}
  .spec-group-title:first-child{margin-top:0;}

  .spec-row{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg-3);}
  .spec-row .fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .spec-row .fields .full{grid-column:1/-1;}
  .spec-row input,.spec-row select{background:#fff;}
  .spec-row .rm{flex:none;}

  .item-bid-input-group{border:2px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;background:var(--bg-3);transition:border-color .15s ease, box-shadow .15s ease;}
  .item-bid-input-group:hover{border-color:var(--gold);box-shadow:0 4px 14px -8px rgba(15,35,64,.18);}
  .item-bid-input-group.is-filled{border-color:var(--ok);background:var(--ok-bg);}
  .item-bid-input-group .item-title{font-weight:800;font-size:19px;margin-bottom:4px;color:var(--ink);}
  .item-bid-input-group .item-detail{font-size:14px;color:var(--ink-soft);margin-bottom:12px;}
  .item-bid-input-group label{font-size:14.5px;}
  .item-bid-input-group input{font-size:16px;padding:13px 14px;}
  .item-bid-input-group input,.item-bid-input-group textarea,.item-bid-input-group select{background:#fff;}
  .item-bid-input-group input:hover,.item-bid-input-group textarea:hover{border-color:var(--ink-dim);}
  .item-offers{margin:8px 0 14px;padding:10px 12px;background:#fff;border:1px dashed var(--line);border-radius:10px;font-size:13.5px;color:var(--ink-soft);}
  .item-offers b{color:var(--ink);}
  .item-submit-msg{font-size:13px;margin-top:8px;min-height:16px;}

  .bid-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:box-shadow .12s ease,border-color .12s ease;}
  .bid-card:hover{box-shadow:0 4px 14px -8px rgba(15,35,64,.16);border-color:var(--ink-dim);}
  .bid-card-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  .company-block{display:flex;flex-direction:column;gap:2px;}
  .company-block .cb-name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .company-block .cb-phone{font-size:12px;color:var(--ink-dim);font-family:'JetBrains Mono';}
  .bid-item-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line-soft);font-size:13.5px;}
  .bid-item-row:first-child{border-top:none;}
  .bid-item-row .lp{font-weight:600;}
  .bid-item-row .rp{font-family:'JetBrains Mono';font-weight:700;color:var(--safety-deep);}
  .bid-item-row.lowest .rp{color:var(--ok);}

  .quote-item{border-top:1px solid var(--line-soft);padding:13px 0;}
  .quote-item:first-child{border-top:none;}
  .quote-note{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .quote-file{font-size:13px;margin-top:6px;}

  .prod-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:box-shadow .12s ease,border-color .12s ease;}
  .prod-card:hover{box-shadow:0 4px 14px -8px rgba(15,35,64,.16);border-color:var(--ink-dim);}
  .prod-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .prod-price{font-family:'JetBrains Mono';font-weight:700;color:var(--safety-deep);font-size:16px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-dim);}
  .empty .disp{font-size:16px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}

  .gate{max-width:380px;margin:12vh auto;text-align:center;}
  .gate .mark{width:52px;height:52px;margin:0 auto 18px;font-size:16px;border-radius:16px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:50;box-shadow:0 12px 30px -8px rgba(15,35,64,.35);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;}
  .toast.show{opacity:1;bottom:32px;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,35,64,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .modal{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(15,35,64,.3);}

  .link-box{display:flex;gap:8px;background:var(--bg-3);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;align-items:center;margin-top:9px;}
  .link-box input{border:none;background:transparent;font-family:'JetBrains Mono';font-size:12.5px;padding:2px;color:var(--ink-soft);}

  .status-line{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  footer{text-align:center;font-size:12px;color:var(--ink-dim);padding:30px 0 40px;}
  @media(max-width:640px){
    .wrap{padding:20px 16px;}
    .job-row{flex-direction:column;align-items:flex-start;}
    .job-actions{justify-content:flex-start;}
    .row{flex-direction:column;}
    .spec-row .fields{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">MET</div>
    <div>
      <h1>ระบบเสนอราคางานก่อสร้าง</h1>
      <div class="sub" id="topbarSub">กองอาคารและสถานที่</div>
      <div class="org">มหาวิทยาลัยราชภัฏอุดรธานี</div>
    </div>
  </div>
  <div id="topbarActions"></div>
</div>

<div class="wrap" id="app"><div class="empty">กำลังโหลด…</div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================================================================
   ตั้งค่า Firebase (คัดลอกจาก Firebase Console > Project settings)
   =================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBFhFb7_vYwujPV4VYpewVo8PlcM_X1yKc",
  authDomain: "met-udru.firebaseapp.com",
  projectId: "met-udru",
  storageBucket: "met-udru.firebasestorage.app",
  messagingSenderId: "480414511578",
  appId: "1:480414511578:web:57e01aca33d6768dc850e3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* ===================================================================
   ตั้งค่า Cloudinary (สำหรับเก็บไฟล์แนบ)
   =================================================================== */
const CLOUDINARY_CLOUD_NAME = "giingj2r";
const CLOUDINARY_UPLOAD_PRESET = "met_udru";

async function uploadToCloudinary(file, folder){
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
  const form = new FormData();
  form.append('file', file);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  form.append('folder', folder);
  const res = await fetch(url, { method:'POST', body: form });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('อัปโหลดไฟล์ไม่สำเร็จ: ' + errText);
  }
  const data = await res.json();
  return { url: data.secure_url, name: file.name };
}

const DEFAULT_CATEGORIES = [
  "งานครุภัณฑ์","งานตกแต่ง","งานฝ้าเพดาน","งานพื้น","งานภูมิทัศน์","งานหลังคา"
];

/* โหมดทดสอบ: ข้ามหน้าล็อกอินแอดมิน ต้องปิดก่อนใช้งานจริง (พร้อมตั้ง Firestore Rules ให้รัดกุม — ดูหมายเหตุด้านล่างสุดของไฟล์) */
const TEST_MODE_NO_LOGIN = true;

const app = document.getElementById('app');
const topbarActions = document.getElementById('topbarActions');
const topbarSub = document.getElementById('topbarSub');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtBaht(n){ const num = Number(n)||0; return num.toLocaleString('th-TH',{maximumFractionDigits:2}) + ' บาท'; }
function fmtDate(ts){ if(!ts) return '-'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function normPhone(p){ return (p||'').replace(/[^0-9]/g,''); }

/* =========================================================
   ROUTER
   - ?vendor=1  -> ลิงก์เดียวสำหรับทุกบริษัท (ประมูลราคา + ข้อมูลสินค้า)
   - ไม่มีพารามิเตอร์ -> หลังบ้านแอดมิน (ต้องล็อกอิน)
========================================================= */
const params = new URLSearchParams(location.search);
const isVendor = params.has('vendor');

if(isVendor){
  topbarSub.textContent = 'พอร์ทัลสำหรับบริษัท';
  topbarActions.innerHTML = '';
  renderVendorPortal();
} else {
  topbarSub.textContent = 'หลังบ้านผู้ดูแล' + (TEST_MODE_NO_LOGIN ? ' (โหมดทดสอบ ไม่ได้ล็อกอิน)' : '');
  if(TEST_MODE_NO_LOGIN){
    renderAdmin({email:'โหมดทดสอบ — ยังไม่ได้ล็อกอิน'});
  } else {
    auth.onAuthStateChanged(user=>{ if(user){ renderAdmin(user); } else { renderLogin(); } });
  }
}

/* =========================================================
   ADMIN: LOGIN
========================================================= */
function renderLogin(){
  topbarActions.innerHTML = '';
  app.innerHTML = `
    <div class="gate card">
      <div class="mark disp" style="width:52px;height:52px;font-size:17px;margin:0 auto 18px;">MET</div>
      <h2 class="disp" style="margin:0 0 4px;">เข้าสู่ระบบผู้ดูแล</h2>
      <p class="hint" style="margin-bottom:18px;">สำหรับเจ้าหน้าที่มหาวิทยาลัยเท่านั้น</p>
      <label>อีเมล</label><input id="loginEmail" type="email" placeholder="admin@example.com">
      <label>รหัสผ่าน</label><input id="loginPass" type="password" placeholder="••••••••">
      <button class="btn btn-primary" style="width:100%;margin-top:18px;" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="hint" id="loginErr" style="color:var(--flame);margin-top:10px;"></div>
      <p class="hint" style="margin-top:16px;">สร้างบัญชีผู้ดูแลได้ที่ Firebase Console &gt; Authentication &gt; Sign-in method &gt; Email/Password</p>
    </div>`;
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr'); err.textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(e=>{ err.textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + (e.message||e.code); });
}

/* =========================================================
   ADMIN: STATE + DASHBOARD SHELL
========================================================= */
let ADMIN_STATE = { tab:'bid', categories:[], jobs:[], products:[], activeCat:'all', productFilter:'', productCat:'all' };

function renderAdmin(user){
  topbarActions.innerHTML = TEST_MODE_NO_LOGIN ? `
    <span class="hint" style="margin:0;color:var(--warn);font-weight:600;">⚠️ โหมดทดสอบ ไม่มีการล็อกอิน</span>
  ` : `
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="hint" style="margin:0;">${escapeHtml(user.email)}</span>
      <button class="btn btn-ghost btn-sm" onclick="auth.signOut()">ออกจากระบบ</button>
    </div>`;
  loadAdminData();
}

async function loadAdminData(){
  app.innerHTML = `<div class="empty">กำลังโหลดข้อมูล…</div>`;
  const catSnap = await db.collection('categories').orderBy('order').get().catch(()=>null);
  if(!catSnap || catSnap.empty){ await seedCategories(); return loadAdminData(); }
  ADMIN_STATE.categories = catSnap.docs.map(d=>({id:d.id, ...d.data()}));

  const jobSnap = await db.collection('jobs').orderBy('createdAt','desc').get();
  ADMIN_STATE.jobs = jobSnap.docs.map(d=>({id:d.id, items:[], ...d.data()}));

  const prodSnap = await db.collection('products').orderBy('submittedAt','desc').get().catch(()=>null);
  ADMIN_STATE.products = prodSnap ? prodSnap.docs.map(d=>({id:d.id, ...d.data()})) : [];

  drawAdminShell();
}

async function seedCategories(){
  const batch = db.batch();
  DEFAULT_CATEGORIES.forEach((name, i)=>{ const ref = db.collection('categories').doc(); batch.set(ref, {name, order:i}); });

async function toggleJobStatus(jobId, newStatus){
  await db.collection('jobs').doc(jobId).update({status:newStatus});
  const j = ADMIN_STATE.jobs.find(j=>j.id===jobId); if(j) j.status = newStatus;
  drawAdminTabContent();
}
async function deleteJob(jobId){
  if(!confirm('ยืนยันลบโครงการนี้? ใบเสนอราคาทั้งหมดของโครงการนี้จะถูกลบด้วย')) return;
  const batch = db.batch();
  const qs = await db.collection('quotes').where('jobId','==',jobId).get();
  qs.docs.forEach(d=>batch.delete(d.ref));
  const ps = await db.collection('publicBids').where('jobId','==',jobId).get();
  ps.docs.forEach(d=>batch.delete(d.ref));
  batch.delete(db.collection('jobs').doc(jobId));
  await batch.commit();
  ADMIN_STATE.jobs = ADMIN_STATE.jobs.filter(j=>j.id!==jobId);
  drawAdminTabContent();
  toast('🗑️ ลบโครงการแล้ว');
}

let openQuotePanels = new Set();
async function toggleQuotes(jobId){
  const el = document.getElementById('quotes-'+jobId);
  if(openQuotePanels.has(jobId)){ openQuotePanels.delete(jobId); el.innerHTML=''; return; }
  openQuotePanels.add(jobId);
  el.innerHTML = `<div class="empty" style="padding:16px;">กำลังโหลดใบเสนอราคา…</div>`;
  const job = ADMIN_STATE.jobs.find(j=>j.id===jobId);
  const items = job.items || [];
  const snap = await db.collection('quotes').where('jobId','==',jobId).get();
  const bidsDocs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(bidsDocs.length===0){
    el.innerHTML = `<div class="empty" style="padding:16px;">ยังไม่มีบริษัทเสนอราคาเข้ามา</div>`;
    return;
  }
  const catIds = [...new Set(items.map(i=>i.categoryId))];
  el.innerHTML = `<div class="card" style="margin-top:8px;">
    <span class="eyebrow">ใบเสนอราคาทั้งหมด (${bidsDocs.length} บริษัท) — จัดกลุ่มตามรายการสเปค เพื่อเทียบราคาสินค้าชนิดเดียวกัน · เห็นราคาได้เฉพาะแอดมิน · ไฮไลต์เขียว = ราคาต่ำสุดของรายการนั้น</span>
    ${catIds.map(cid=>`
      <div class="spec-group-title">${escapeHtml(catName(cid))}</div>
      ${items.filter(it=>it.categoryId===cid).map(it=>{
        const offers = bidsDocs.filter(b=>(b.bids||{})[it.id]).map(b=>({b, bid:b.bids[it.id]}));
        if(offers.length===0) return '';
        let min = Infinity;
        offers.forEach(o=>{ if(typeof o.bid.price==='number' && o.bid.price<min) min = o.bid.price; });
        offers.sort((a,c)=>{
          const pa = typeof a.bid.price==='number' ? a.bid.price : Infinity;
          const pc = typeof c.bid.price==='number' ? c.bid.price : Infinity;
          return pa - pc;
        });
        return `<div class="bid-card">
          <div class="item-title" style="font-size:16px;margin-bottom:2px;">${escapeHtml(it.name)}</div>
          <div class="item-detail" style="margin-bottom:10px;">${[it.spec, it.unit?('หน่วย: '+it.unit):'', it.qty?('จำนวน: '+it.qty):''].filter(Boolean).join(' · ')||'-'}</div>
          ${offers.map(({b,bid})=>{
            const isLowest = bid.price === min;
            return `<div class="bid-item-row ${isLowest?'lowest':''}">
              <span class="lp">${escapeHtml(b.companyName)} ${b.isEdited?'<span class="badge badge-edited">✏️ แก้ไขแล้ว</span>':''}${bid.product?' · เสนอ: '+escapeHtml(bid.product):''}</span>
              <span class="rp">${bid.price!=null?fmtBaht(bid.price):'-'}${isLowest?' <span class="badge badge-lowest">🏆 ต่ำสุด</span>':''}</span>
            </div>
            ${bid.note?`<div class="quote-note" style="margin:2px 0 6px;">รายละเอียด: ${escapeHtml(bid.note)}</div>`:''}
            ${bid.fileURL?`<div class="quote-file" style="margin-bottom:4px;">📎 <a href="${bid.fileURL}" target="_blank" rel="noopener">${escapeHtml(bid.fileName||'เอกสารแนบ')}</a></div>`:''}
            <div class="hint" style="margin:0 0 10px;">โทร ${escapeHtml(b.companyPhone)} · ส่งล่าสุด ${fmtDate(b.updatedAt||b.submittedAt)}</div>`;
          }).join('')}
        </div>`;
      }).join('') || '<div class="hint">ยังไม่มีบริษัทเสนอในหมวดนี้</div>'}
    `).join('')}
  </div>`;
}

function addSpecRow(){ SPEC_DRAFT.push({id: uid(), categoryId: ADMIN_STATE.categories[0].id, name:'', spec:'', unit:'', qty:''}); drawSpecRows(); }
function removeSpecRow(id){ SPEC_DRAFT = SPEC_DRAFT.filter(s=>s.id!==id); drawSpecRows(); }
function updateSpecField(id, field, val){ const s = SPEC_DRAFT.find(s=>s.id===id); if(s) s[field]=val; }
function drawSpecRows(){
  const el = document.getElementById('specRows');
  if(!el) return;
  const catOpts = c => ADMIN_STATE.categories.map(cat=>`<option value="${cat.id}" ${c===cat.id?'selected':''}>${escapeHtml(cat.name)}</option>`).join('');
  el.innerHTML = SPEC_DRAFT.length===0 ? '<div class="hint" style="margin-bottom:10px;">📭 ยังไม่มีรายการสเปค กด “เพิ่มรายการสเปค” เพื่อเริ่ม</div>' :
    SPEC_DRAFT.map(s=>`
      <div class="spec-row">
        <div class="fields">
          <select onchange="updateSpecField('${s.id}','categoryId',this.value)">${catOpts(s.categoryId)}</select>
          <input placeholder="รายการ เช่น กระเบื้อง 60×60" value="${escapeHtml(s.name)}" oninput="updateSpecField('${s.id}','name',this.value)">
          <input class="full" placeholder="สเปค/รายละเอียด เช่น เกรด A สีเทา กันลื่น" value="${escapeHtml(s.spec)}" oninput="updateSpecField('${s.id}','spec',this.value)">
          <input placeholder="หน่วย เช่น ตร.ม." value="${escapeHtml(s.unit)}" oninput="updateSpecField('${s.id}','unit',this.value)">
          <input placeholder="จำนวน" value="${escapeHtml(s.qty)}" oninput="updateSpecField('${s.id}','qty',this.value)">

async function saveJob(jobId){
  const title = document.getElementById('newJobTitle').value.trim();
  const description = document.getElementById('newJobDesc').value.trim();
  const deadline = document.getElementById('newJobDeadline').value.trim();
  if(!title){ toast('กรุณากรอกชื่อโครงการ'); return; }
  const items = SPEC_DRAFT.filter(s=>s.name.trim()).map(s=>({...s, name: s.name.trim()}));
  if(jobId){
    await db.collection('jobs').doc(jobId).update({title, description, deadline, items});
    toast('✅ บันทึกการแก้ไขแล้ว');
  } else {
    await db.collection('jobs').add({title, description, deadline, items, status:'open', createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    toast('✅ สร้างโครงการแล้ว');
  }
  document.querySelector('.modal-bg')?.remove();
  loadAdminData();
}

function syncCompanyField(val, type){
  if(type==='name'){
    VENDOR_STATE.companyName = val;
    document.querySelectorAll('[id^="bidcompany_"],[id^="pCompany"]').forEach(el=>{ if(!el.value) el.value = val; });
  } else {

async function loadVendorJobDetail(jobId){
  const job = VENDOR_STATE.jobs.find(j=>j.id===jobId);
  VENDOR_STATE.activeJob = job;
  VENDOR_STATE.existingBid = null;

  const pubSnap = await db.collection('publicBids').where('jobId','==',jobId).get().catch(()=>null);
  VENDOR_STATE.publicBids = pubSnap ? pubSnap.docs.map(d=>d.data()) : [];

  const phone = normPhone(VENDOR_STATE.companyPhone);
  if(phone){
    const quoteDoc = await db.collection('quotes').doc(jobId+'_'+phone).get().catch(()=>null);
    VENDOR_STATE.existingBid = (quoteDoc && quoteDoc.exists) ? quoteDoc.data() : null;
  }

}

/* เมื่อกรอกเบอร์ในรายการใดรายการหนึ่งแล้วออกจากช่อง ให้ลองดึงใบเสนอราคาเดิม (ถ้ามี) มาเติมให้ทุกรายการ */
async function lookupExistingBidFromPhone(jobId, phoneVal){
  const phone = normPhone(phoneVal);
  if(!phone) return;
  const quoteDoc = await db.collection('quotes').doc(jobId+'_'+phone).get().catch(()=>null);
  const bid = (quoteDoc && quoteDoc.exists) ? quoteDoc.data() : null;
  if(bid){
    VENDOR_STATE.existingBid = bid;
    VENDOR_STATE.companyName = bid.companyName || VENDOR_STATE.companyName;
    VENDOR_STATE.companyPhone = bid.companyPhone || phoneVal;
    drawVendorJobDetailBody();
  }
}

/* ส่งราคาทีละรายการสเปค — แต่ละรายการเป็นใบเสนอราคาแยกอิสระ ไม่ต้องกรอกครบทุกรายการ */
async function submitItemBid(jobId, itemId){
  const companyEl = document.getElementById('bidcompany_'+itemId);
  const phoneEl = document.getElementById('bidphone_'+itemId);
  const prodEl = document.getElementById('bidprod_'+itemId);
  const priceEl = document.getElementById('bidprice_'+itemId);
  const noteEl = document.getElementById('biditemnote_'+itemId);
  const fileEl = document.getElementById('biditemfile_'+itemId);
  const btn = document.getElementById('itembtn_'+itemId);
  const msg = document.getElementById('itemmsg_'+itemId);
  const card = document.getElementById('itemcard_'+itemId);
  const companyVal = companyEl ? companyEl.value.trim() : '';
  const phoneRaw = phoneEl ? phoneEl.value.trim() : '';
  const phone = normPhone(phoneRaw);
  const priceVal = priceEl ? parseFloat(priceEl.value) : NaN;
  const prodVal = prodEl ? prodEl.value.trim() : '';
  const noteVal = noteEl ? noteEl.value.trim() : '';
  if(!companyVal || !phone){
    msg.style.color='var(--flame)'; msg.textContent='กรุณากรอกชื่อบริษัทและเบอร์ติดต่อก่อนส่ง';
    return;
  }
  if(isNaN(priceVal) && !prodVal){
    msg.style.color='var(--flame)'; msg.textContent='กรุณากรอกผลิตภัณฑ์หรือราคาก่อนส่ง';
    return;
  }
  const prevBtnText = btn.textContent;
  btn.disabled = true; btn.textContent = 'กำลังส่ง…'; msg.style.color='var(--ink-soft)'; msg.textContent='';

  const quoteId = jobId+'_'+phone;
  const quoteRef = db.collection('quotes').doc(quoteId);
  const pubRef = db.collection('publicBids').doc(quoteId);
  try{
    const existing = await quoteRef.get();
    const wasEdit = existing.exists;
    const prevEntry = wasEdit ? ((existing.data().bids||{})[itemId] || {}) : {};
    let fileURL = prevEntry.fileURL || null;
    let fileName = prevEntry.fileName || null;
    const file = fileEl && fileEl.files[0];
    if(file){
      btn.textContent = 'กำลังอัปโหลดไฟล์แนบ…';
      const uploaded = await uploadToCloudinary(file, `quotes/${jobId}/${itemId}`);
      fileURL = uploaded.url; fileName = uploaded.name;
      btn.textContent = 'กำลังส่ง…';
    }

    const entry = { product: prodVal, note: noteVal, fileURL, fileName };
    if(!isNaN(priceVal)) entry.price = priceVal;
    const priceMask = !isNaN(priceVal) ? 'X'.repeat(String(Math.trunc(Math.abs(priceVal))).length) : null;

    const payload = {
      jobId, companyName: companyVal, companyPhone: phoneRaw,
      bids: { [itemId]: entry },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: wasEdit
    };
    if(wasEdit){ payload.firstSubmittedAt = existing.data().firstSubmittedAt || existing.data().submittedAt || firebase.firestore.FieldValue.serverTimestamp(); }
    else { payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp(); payload.firstSubmittedAt = firebase.firestore.FieldValue.serverTimestamp(); }
    await quoteRef.set(payload, {merge:true});

    await pubRef.set({
      jobId, companyName: companyVal, companyPhone: phoneRaw,
      bids: { [itemId]: { product: entry.product || '', note: entry.note || '', priceMask, hasFile: !!fileURL } },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: wasEdit,
      submittedAt: payload.firstSubmittedAt || firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    VENDOR_STATE.companyName = companyVal;
    VENDOR_STATE.companyPhone = phoneRaw;
    msg.style.color='var(--ok)'; msg.textContent = '✅ ส่งราคารายการนี้เรียบร้อยแล้ว';
    toast('✅ บันทึกราคารายการนี้แล้ว');
    if(!VENDOR_STATE.existingBid) VENDOR_STATE.existingBid = { bids:{} };
    if(!VENDOR_STATE.existingBid.bids) VENDOR_STATE.existingBid.bids = {};
    VENDOR_STATE.existingBid.bids[itemId] = entry;
    card?.classList.add('is-filled');
    btn.textContent = '✏️ แก้ไข/ส่งราคารายการนี้อีกครั้ง';
  }catch(e){
    msg.style.color='var(--flame)'; msg.textContent = 'เกิดข้อผิดพลาด: ' + (e.message||e);
    btn.textContent = prevBtnText;
  }finally{
    btn.disabled = false;
  }
}

async function loadMyProducts(){
  const companyQuery = (document.getElementById('searchCompany').value||'').trim();
  const phoneQuery = (document.getElementById('searchPhone').value||'').trim();
  const nameQuery = (document.getElementById('searchProductName').value||'').trim().toLowerCase();
  if(!companyQuery && !phoneQuery && !nameQuery){
    toast('กรุณากรอกชื่อบริษัท เบอร์โทร หรือชื่อผลิตภัณฑ์อย่างน้อยหนึ่งช่อง');
    return;
  }
  const el = document.getElementById('myProductsList');
  el.innerHTML = 'กำลังค้นหา…';
  let list = [];
  try{
    if(phoneQuery){
      const snap = await db.collection('products').where('companyPhone','==', phoneQuery).get();
      list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    } else {
      const snap = await db.collection('products').get();
      list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    }
    if(companyQuery){
      const cLower = companyQuery.toLowerCase();
      list = list.filter(p=>(p.companyName||'').toLowerCase().includes(cLower));
    }
    if(nameQuery){
      list = list.filter(p=>(p.productName||'').toLowerCase().includes(nameQuery));
    }
  }catch(e){
    el.innerHTML = 'เกิดข้อผิดพลาดในการค้นหา: ' + (e.message||e);
    return;
  }
  VENDOR_STATE.myProducts = list;
  if(list.length===0){ el.innerHTML = 'ไม่พบรายการที่ตรงกับการค้นหา'; return; }
  el.innerHTML = list.map(p=>`
    <div class="prod-card">
      <div class="prod-top"><span class="quote-company" style="font-weight:700;">${escapeHtml(p.productName)}</span></div>
      <div class="quote-note">${escapeHtml(vCatName(p.categoryId))} · ${escapeHtml(p.companyName)}</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="editMyProduct('${p.id}')">✏️ แก้ไขรายการนี้</button>
    </div>`).join('');
}
function editMyProduct(id){
  const p = VENDOR_STATE.myProducts.find(p=>p.id===id); if(!p) return;
  VENDOR_STATE.editingProductId = id;
  VENDOR_STATE.companyName = p.companyName || VENDOR_STATE.companyName;
  VENDOR_STATE.companyPhone = p.companyPhone || VENDOR_STATE.companyPhone;
  const pCompanyEl = document.getElementById('pCompany'); if(pCompanyEl) pCompanyEl.value = VENDOR_STATE.companyName;
  const pPhoneEl = document.getElementById('pPhone'); if(pPhoneEl) pPhoneEl.value = VENDOR_STATE.companyPhone;
  document.getElementById('pCategory').value = p.categoryId||'';
  document.getElementById('pName').value = p.productName||'';
  document.getElementById('pPrice').value = p.price!=null?p.price:'';
  document.getElementById('pDesc').value = p.description||'';
  document.getElementById('submitProdBtn').textContent = '💾 บันทึกการแก้ไข';
  window.scrollTo({top:0, behavior:'smooth'});
  toast('✏️ โหลดข้อมูลมาแก้ไขแล้ว');
}

async function submitProduct(){
  const companyName = (document.getElementById('pCompany').value||'').trim();
  const companyPhone = (document.getElementById('pPhone').value||'').trim();
  const categoryId = document.getElementById('pCategory').value;
  const productName = document.getElementById('pName').value.trim();
  const priceVal = parseFloat(document.getElementById('pPrice').value);
  const description = document.getElementById('pDesc').value.trim();
  const fileInput = document.getElementById('pFile');
  const btn = document.getElementById('submitProdBtn');
  const msg = document.getElementById('submitProdMsg');
  if(!companyName || !normPhone(companyPhone)){ msg.style.color='var(--flame)'; msg.textContent='กรุณากรอกชื่อบริษัทและเบอร์ติดต่อก่อน'; return; }
  if(!productName){ msg.style.color='var(--flame)'; msg.textContent='กรุณากรอกชื่อสินค้า'; return; }
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; msg.textContent='';
  try{
    const isEdit = !!VENDOR_STATE.editingProductId;
    const id = VENDOR_STATE.editingProductId || uid();
    const ref = db.collection('products').doc(id);
    const pubRef = db.collection('publicProducts').doc(id);
    let fileURL = null, fileName = null;
    if(isEdit){ const cur = await ref.get(); if(cur.exists){ fileURL = cur.data().fileURL||null; fileName = cur.data().fileName||null; } }
    const file = fileInput.files[0];
    if(file){
      btn.textContent = 'กำลังอัปโหลดไฟล์แนบ…';
      const uploaded = await uploadToCloudinary(file, `products/${id}`);
      fileURL = uploaded.url; fileName = uploaded.name;
      btn.textContent = 'กำลังบันทึก…';
    }
    VENDOR_STATE.companyName = companyName;
    VENDOR_STATE.companyPhone = companyPhone;
    const payload = {
      companyName, companyPhone, productName, categoryId, price: isNaN(priceVal)?null:priceVal, description, fileURL, fileName,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: isEdit
    };
    if(!isEdit) payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp();
    await ref.set(payload, {merge:true});

    await pubRef.set({
      companyName, companyPhone, productName, categoryId, description,
      fileURL: firebase.firestore.FieldValue.delete(), fileName: firebase.firestore.FieldValue.delete(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(), isEdited: isEdit,
      submittedAt: payload.submittedAt || firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    msg.style.color='var(--ok)'; msg.textContent = isEdit ? '✅ แก้ไขข้อมูลสินค้าเรียบร้อยแล้ว' : '✅ บันทึกข้อมูลสินค้าเรียบร้อยแล้ว ขอบคุณครับ';
    toast('✅ บันทึกสินค้าแล้ว');
    VENDOR_STATE.editingProductId = null;
    btn.textContent = '💾 บันทึกข้อมูลสินค้า';
    loadMyProducts();
    loadPublicCatalog();
  }catch(e){
    msg.style.color='var(--flame)'; msg.textContent = 'เกิดข้อผิดพลาด: ' + (e.message||e);
  }finally{
    btn.disabled = false;
  }
}

/* ===================================================================
   หมายเหตุความปลอดภัยของราคา (สำคัญ)
   แอปนี้เป็นหน้าเว็บฝั่ง client ล้วน ไม่มีเซิร์ฟเวอร์ตรงกลาง การซ่อนราคา
   จากบริษัทอื่นในหน้าจอทำได้แล้ว (หน้า Bidding/Data ฝั่งบริษัทดึงข้อมูลจาก
   collection "publicBids" / "publicProducts" ซึ่งไม่มีฟิลด์ราคาอยู่จริง)
   แต่ collection "quotes" และ "products" (ที่มีราคา) ยังอ่านได้จากฝั่ง client
   หากไม่ได้ตั้ง Firestore Security Rules จำกัดสิทธิ์ไว้ แนะนำให้ตั้งกฎ
   ประมาณนี้ใน Firebase Console > Firestore Database > Rules เพื่อให้
   เฉพาะแอดมิน (ผู้ล็อกอิน) เท่านั้นที่อ่าน "quotes" และ "products" ได้:

   match /quotes/{id}   { allow read: if request.auth != null; allow write: if true; }
   match /products/{id} { allow read: if request.auth != null; allow write: if true; }
   match /publicBids/{id}     { allow read, write: if true; }
   match /publicProducts/{id} { allow read, write: if true; }
   match /jobs/{id}       { allow read: if true; allow write: if request.auth != null; }
   match /categories/{id} { allow read: if true; allow write: if request.auth != null; }

   (และต้องปิด TEST_MODE_NO_LOGIN เป็น false ก่อนใช้งานจริง)
